name: similarityly

services:
  qdrant:
    # Pinned by tag + digest; keep the minor version in step with qdrant-client
    # in backend/uv.lock. Dependabot proposes updates.
    image: qdrant/qdrant:v1.20.2@sha256:d277592721d2e3b73f9b797b53cf05e6a5bb2134f6d13fdbda4ca51782afbcac
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      # For running the API outside Docker against this Qdrant.
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp is enough to hit /readyz.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      # Bundled Qdrant, used until another one is saved on the Settings page.
      # All connections (Qdrant, embedding service, LLM) are configured there.
      SIM_DEFAULT_QDRANT_URL: http://qdrant:6333
      # Strongly recommended whenever the web port is reachable from other machines.
      SIM_API_TOKEN: ${SIM_API_TOKEN:-}
      # Only for a separate API domain: the UI's origin, e.g. https://sim.example.com.
      SIM_CORS_ORIGINS: ${SIM_CORS_ORIGINS:-}
    volumes:
      # settings.json (connections saved from the UI) + downloaded embedding models
      - api_data:/data
    ports:
      # Local-only by default. For a separate API domain, put a TLS reverse proxy in
      # front of this port (or set API_BIND=0.0.0.0), and set SIM_API_TOKEN.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Public URL of the API when it has its own domain (https://api.sim.example.com).
      # Empty = the UI calls /api on its own origin, proxied to the api service.
      API_URL: ${API_URL:-}
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Local-only by default. Set WEB_BIND=0.0.0.0 to expose it, and set SIM_API_TOKEN too.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  qdrant_data:
  api_data:
