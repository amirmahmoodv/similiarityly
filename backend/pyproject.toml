[project]
name = "similarityly-backend"
version = "0.1.0"
description = "Similarity checking platform: FastAPI + Qdrant"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.2",
    "anthropic>=0.40",
]

[project.optional-dependencies]
# Local multilingual embedding models (ONNX). Needed for the "fastembed" provider.
local = ["fastembed>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
