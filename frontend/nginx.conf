server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Uploads: keep in step with SIM_MAX_UPLOAD_MB on the API.
    client_max_body_size 60m;

    # Security headers. nginx drops server-level add_header in any location that
    # sets its own, so they live in one snippet included everywhere.
    include /etc/nginx/snippets/security-headers.conf;

    # /api/ location, written at container start by 40-similarityly-config.sh:
    # a proxy to API_UPSTREAM when API_URL is empty (same origin), otherwise a 404.
    # Generated rather than fixed so nginx never resolves an upstream it won't use
    # (it fails to start when the host does not exist).
    include /etc/nginx/snippets/api-location.conf;

    # Runtime config written at container start; must never be cached.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
