server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Uploads: keep in step with SIM_MAX_UPLOAD_MB on the API.
    client_max_body_size 60m;

    # Security headers. nginx drops server-level add_header in any location that
    # sets its own, so they live in one snippet included everywhere.
    include /etc/nginx/snippets/security-headers.conf;

    # Same-origin API (when API_URL is empty). With a separate API domain the UI
    # calls that domain directly and this location is unused.
    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Runtime config written at container start; must never be cached.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store";
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}
